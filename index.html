<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q&A 간담회</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:'Noto Sans KR',sans-serif;background:#4a2c0e}
 
#board{
  width:100vw;height:100vh;
  background-color:#b8934a;
  background-image:
    radial-gradient(ellipse at 15% 20%,rgba(190,148,70,.55) 0%,transparent 55%),
    radial-gradient(ellipse at 85% 80%,rgba(130,84,24,.5) 0%,transparent 55%),
    repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.03) 3px,rgba(0,0,0,.03) 4px),
    repeating-linear-gradient(90deg,transparent,transparent 3px,rgba(0,0,0,.02) 3px,rgba(0,0,0,.02) 4px);
  display:flex;flex-direction:column;
  padding:10px 14px 10px;
  border:14px solid #4a2c0e;
  outline:3px solid #6b3c14;
  box-shadow:inset 0 0 40px rgba(0,0,0,.35),0 0 0 2px #3a1e06;
}
 
/* HEADER */
.header{text-align:center;margin-bottom:8px;flex-shrink:0}
.tape{
  display:inline-block;background:rgba(255,248,180,.85);
  padding:2px 44px 4px;transform:rotate(-.5deg);
  box-shadow:2px 3px 8px rgba(0,0,0,.28);position:relative;
}
.tape::before,.tape::after{content:'';position:absolute;top:0;width:24px;height:100%;background:rgba(210,225,255,.45)}
.tape::before{left:-12px;transform:rotate(-1deg)}
.tape::after{right:-12px;transform:rotate(1deg)}
.title{font-family:'Caveat',cursive;font-size:36px;font-weight:700;color:#2c1810;letter-spacing:6px;line-height:1}
.subtitle{font-size:10px;color:#7a4a1a;letter-spacing:2px;margin-top:0px}
 
/* GRID — 6×4, fills remaining height */
.grid{
  flex:1;min-height:0;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(4,1fr);
  gap:8px;
}
 
/* NOTE */
.note{
  position:relative;cursor:pointer;
  transform:rotate(var(--rot));
  transition:transform .18s ease;
  animation:pop .38s ease both;
  z-index:1;
}
@keyframes pop{
  from{opacity:0;transform:scale(.75) rotate(var(--rot))}
  to{opacity:1;transform:scale(1) rotate(var(--rot))}
}
.note:hover{transform:scale(1.12) rotate(0deg)!important;z-index:20}
 
.note-inner{
  width:100%;height:100%;
  background:var(--bg);
  padding:7px 8px 10px;
  display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:3px 5px 12px rgba(0,0,0,.32),inset 0 -2px 4px rgba(0,0,0,.07);
  position:relative;overflow:hidden;
}
.note-inner::after{
  content:'';position:absolute;bottom:0;right:0;
  border-style:solid;border-width:0 0 11px 11px;
  border-color:transparent transparent rgba(0,0,0,.13) transparent;
}
 
/* tack */
.tack{
  position:absolute;top:-7px;left:50%;transform:translateX(-50%);
  width:12px;height:12px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#e8e8e8,#777);
  box-shadow:0 2px 4px rgba(0,0,0,.55);z-index:2;
}
.tack::after{
  content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  width:2px;height:6px;background:linear-gradient(to bottom,#888,#444);
}
 
.note-num{
  font-family:'Caveat',cursive;font-size:10px;font-weight:700;
  color:var(--ac);opacity:.6;letter-spacing:.5px;
}
/* 키워드: 짧고 굵게 */
.note-kw{
  font-family:'Caveat',cursive;
  font-size:clamp(13px,1.3vw,17px);
  font-weight:700;color:#1e0f05;
  line-height:1.25;
  word-break:keep-all;
}
 
/* answered */
.note.answered .note-inner::before{
  content:'✓';position:absolute;top:4px;right:6px;
  font-size:13px;font-weight:700;color:var(--ac);opacity:.4;
}
 
/* MODAL */
#modal{
  display:none;position:fixed;inset:0;
  background:rgba(20,10,4,.8);
  backdrop-filter:blur(5px);
  z-index:500;align-items:center;justify-content:center;
}
#modal.open{display:flex}
 
.modal-card{
  background:var(--m-bg,#fef9c3);
  max-width:640px;width:90%;
  padding:44px 50px 50px;
  position:relative;
  box-shadow:10px 16px 60px rgba(0,0,0,.7),inset 0 -4px 12px rgba(0,0,0,.08);
  animation:cardIn .35s cubic-bezier(.22,1,.36,1) both;
}
@keyframes cardIn{
  from{opacity:0;transform:scale(.84) translateY(28px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}
.modal-card::after{
  content:'';position:absolute;bottom:0;right:0;
  border-style:solid;border-width:0 0 40px 40px;
  border-color:transparent transparent rgba(0,0,0,.1) transparent;
}
.m-tack{
  position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  width:24px;height:24px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#f0f0f0,#888);
  box-shadow:0 3px 10px rgba(0,0,0,.65);
}
.m-tack::after{
  content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  width:3.5px;height:12px;background:linear-gradient(to bottom,#888,#444);
}
 
.m-num{
  font-family:'Caveat',cursive;font-size:14px;font-weight:700;
  color:var(--m-ac);opacity:.65;letter-spacing:2px;margin-bottom:14px;
}
.m-info{
  display:flex;align-items:baseline;gap:16px;
  margin-bottom:18px;padding-bottom:16px;
  border-bottom:1.5px dashed rgba(0,0,0,.15);
}
.m-id{font-family:'Noto Sans KR',sans-serif;font-size:17px;font-weight:500}
.m-name{font-family:'Caveat',cursive;font-size:34px;font-weight:700;color:#1a0a02}
.m-q-label{font-family:'Caveat',cursive;font-size:12px;color:var(--m-ac);letter-spacing:1px;opacity:.6;margin-bottom:8px}
.m-question{
  font-family:'Caveat',cursive;
  font-size:clamp(26px,3.8vw,36px);
  font-weight:600;color:#1a0a02;line-height:1.55;
}
.m-footer{display:flex;justify-content:space-between;align-items:center;margin-top:26px}
.m-close{
  font-family:'Caveat',cursive;font-size:17px;
  background:rgba(0,0,0,.08);border:1.5px solid rgba(0,0,0,.15);
  color:#3a2008;padding:7px 22px;border-radius:4px;cursor:pointer;transition:background .15s;
}
.m-close:hover{background:rgba(0,0,0,.16)}
.m-answered{
  font-family:'Caveat',cursive;font-size:15px;
  background:none;border:1.5px solid var(--m-ac);
  color:var(--m-ac);padding:7px 16px;border-radius:4px;cursor:pointer;transition:all .15s;
}
.m-answered.on{background:var(--m-ac);color:#fff}
 
/* FAB + EDIT */
.fab{
  position:fixed;bottom:20px;right:20px;
  width:42px;height:42px;border-radius:50%;
  background:#4a2c0e;border:2px solid #c8a96e;
  color:#e8c97a;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.5);transition:transform .2s;z-index:400;
}
.fab:hover{transform:scale(1.1) rotate(12deg)}
.edit-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:600;align-items:center;justify-content:center}
.edit-overlay.open{display:flex}
.edit-box{background:#2c1810;border:2px solid #c8a96e;padding:26px;max-width:780px;width:96%;max-height:88vh;overflow-y:auto;border-radius:4px}
.edit-box h2{font-family:'Caveat',cursive;font-size:24px;color:#e8c97a;margin-bottom:14px}
.edit-table{width:100%;border-collapse:collapse;margin-bottom:14px}
.edit-table th{font-size:11px;color:#c8a96e;letter-spacing:1px;padding:0 5px 7px;text-align:left;border-bottom:1px solid rgba(200,169,110,.3)}
.edit-table td{padding:4px 3px}
.edit-table input{width:100%;font-family:'Noto Sans KR',sans-serif;font-size:12px;background:rgba(255,255,255,.07);border:1px solid rgba(200,169,110,.35);color:#f0e0b0;padding:5px 7px;border-radius:3px;outline:none}
.edit-table input:focus{border-color:#c8a96e}
.del-btn{background:none;border:1px solid rgba(255,100,100,.35);color:#ff8888;width:24px;height:24px;border-radius:3px;cursor:pointer;font-size:12px}
.e-add{font-family:'Caveat',cursive;font-size:15px;background:rgba(200,169,110,.2);border:1px solid #c8a96e;color:#e8c97a;padding:5px 16px;border-radius:3px;cursor:pointer;margin-right:7px}
.e-save{font-family:'Caveat',cursive;font-size:15px;background:#c8a96e;border:none;color:#2c1810;font-weight:700;padding:5px 20px;border-radius:3px;cursor:pointer;margin-right:7px}
.e-cancel{font-family:'Caveat',cursive;font-size:15px;background:none;border:1px solid rgba(255,255,255,.2);color:#aaa;padding:5px 14px;border-radius:3px;cursor:pointer}
</style>
</head>
<body>
 
<div id="board">
  <div class="header">
    <div class="tape">
      <div class="title">Q &amp; A</div>
      <div class="subtitle">포스트잇을 클릭하면 질문이 펼쳐집니다</div>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</div>
 
<div id="modal">
  <div class="modal-card" id="modalCard">
    <div class="m-tack"></div>
    <div class="m-num" id="mNum"></div>
    <div class="m-info">
      <span class="m-id" id="mId"></span>
      <span class="m-name" id="mName"></span>
    </div>
    <div class="m-q-label">질문</div>
    <div class="m-question" id="mQ"></div>
    <div class="m-footer">
      <button class="m-close" onclick="closeModal()">← 닫기</button>
      <button class="m-answered" id="answeredBtn" onclick="toggleAnswered()">✓ 답변 완료</button>
    </div>
  </div>
</div>
 
<button class="fab" onclick="openEdit()" title="편집">✎</button>
 
<div class="edit-overlay" id="editOverlay">
  <div class="edit-box">
    <h2>📌 질문 목록 편집</h2>
    <table class="edit-table">
      <thead><tr>
        <th style="width:100px">학번</th>
        <th style="width:75px">이름</th>
        <th style="width:120px">키워드 (포스트잇)</th>
        <th>질문 전체</th>
        <th style="width:28px"></th>
      </tr></thead>
      <tbody id="editBody"></tbody>
    </table>
    <button class="e-add" onclick="addRow()">+ 추가</button>
    <button class="e-save" onclick="saveEdit()">저장</button>
    <button class="e-cancel" onclick="closeEdit()">취소</button>
  </div>
</div>
 
<script>
const COLORS=[
  {bg:'#fef9c3',ac:'#a16207'},
  {bg:'#bbf7d0',ac:'#15803d'},
  {bg:'#fecaca',ac:'#b91c1c'},
  {bg:'#bfdbfe',ac:'#1d4ed8'},
  {bg:'#e9d5ff',ac:'#7c3aed'},
  {bg:'#fed7aa',ac:'#c2410c'},
  {bg:'#99f6e4',ac:'#0f766e'},
  {bg:'#fce7f3',ac:'#be185d'},
  {bg:'#d9f99d',ac:'#3f6212'},
  {bg:'#fde68a',ac:'#92400e'},
  {bg:'#c7d2fe',ac:'#3730a3'},
  {bg:'#fbcfe8',ac:'#9d174d'},
];
const ROTS=[-3,1.5,-1.5,2.5,-2,3,-1,2,-2.5,1.5,-3,2,-1,3,-2,1,-3.5,2.5,-1,3,-2.5,1.5,-1.5,2];
 
let data=[
  {id:'20210001',name:'김민준',kw:'업무 환경',q:'업무 환경에서 가장 개선이 필요한 부분은 무엇인가요?'},
  {id:'20210002',name:'이서연',kw:'팀 소통',q:'팀 내 소통에서 어려움을 느끼는 상황이 있나요?'},
  {id:'20210003',name:'박도윤',kw:'보람',q:'올해 가장 보람 있었던 순간은 언제였나요?'},
  {id:'20210004',name:'최지아',kw:'회사 방향',q:'회사가 앞으로 집중해야 할 방향이 있다면?'},
  {id:'20210005',name:'정시우',kw:'어려움',q:'업무 중 가장 어려웠던 점은 무엇인가요?'},
  {id:'20210006',name:'강하은',kw:'조직 문화',q:'조직 문화에서 꼭 지켜야 할 것이 있다면?'},
  {id:'20210007',name:'윤준서',kw:'성장 지원',q:'개인 성장을 위해 회사에 바라는 지원이 있다면?'},
  {id:'20210008',name:'임나은',kw:'협업',q:'동료와의 협업에서 개선하고 싶은 점이 있나요?'},
  {id:'20210009',name:'한지호',kw:'워라밸',q:'업무와 일상의 균형을 유지하는 본인만의 방법이 있나요?'},
  {id:'20210010',name:'오서진',kw:'성장 분야',q:'입사 이후 가장 많이 성장한 분야는 무엇이라 생각하나요?'},
  {id:'20210011',name:'서예준',kw:'업무 목표',q:'현재 가장 집중하고 있는 업무 목표는 무엇인가요?'},
  {id:'20210012',name:'전수아',kw:'리더십',q:'팀장이나 리더에게 바라는 점이 있다면?'},
  {id:'20210013',name:'황이준',kw:'복지',q:'회사의 복지 중 가장 만족스러운 것은 무엇인가요?'},
  {id:'20210014',name:'신지유',kw:'동료 도움',q:'동료에게 받은 도움 중 가장 기억에 남는 것은?'},
  {id:'20210015',name:'류준혁',kw:'도전',q:'앞으로 도전해 보고 싶은 프로젝트나 역할이 있나요?'},
  {id:'20210016',name:'배채원',kw:'회의 문화',q:'회의 문화에서 개선됐으면 하는 점이 있나요?'},
  {id:'20210017',name:'조민서',kw:'충전 방법',q:'업무 외 시간에 주로 어떤 활동으로 충전하시나요?'},
  {id:'20210018',name:'권도현',kw:'의미 있는 일',q:'지금까지 맡은 업무 중 가장 의미 있었던 것은?'},
  {id:'20210019',name:'문지원',kw:'온보딩',q:'신입이 적응하기 좋은 환경을 만들려면 무엇이 필요할까요?'},
  {id:'20210020',name:'남현우',kw:'팀 성과',q:'팀 성과를 높이기 위한 본인의 아이디어가 있다면?'},
  {id:'20210021',name:'송아린',kw:'자랑스러움',q:'현재 조직에서 가장 자랑스러운 점은 무엇인가요?'},
  {id:'20210022',name:'변태양',kw:'업무 효율',q:'업무 효율을 높이기 위해 도입했으면 하는 도구나 방식은?'},
  {id:'20210023',name:'구세은',kw:'자유 발언',q:'자유롭게 하고 싶은 이야기를 들려주세요.'},
  {id:'20210024',name:'홍예린',kw:'오늘의 주제',q:'오늘 간담회에서 꼭 나눠보고 싶은 주제가 있다면?'},
];
 
let answered=new Array(data.length).fill(false);
let currentIdx=0;
 
function render(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  data.forEach((d,i)=>{
    const c=COLORS[i%COLORS.length];
    const rot=ROTS[i%ROTS.length];
    const div=document.createElement('div');
    div.className='note'+(answered[i]?' answered':'');
    div.style.cssText=`--rot:${rot}deg;--bg:${c.bg};--ac:${c.ac};animation-delay:${(i*.025).toFixed(2)}s`;
    div.innerHTML=`
      <div class="tack"></div>
      <div class="note-inner">
        <div class="note-num">Q ${String(i+1).padStart(2,'0')}</div>
        <div class="note-kw">${d.kw}</div>
      </div>`;
    div.onclick=()=>openModal(i);
    grid.appendChild(div);
  });
}
 
function openModal(idx){
  currentIdx=idx;
  const d=data[idx];
  const c=COLORS[idx%COLORS.length];
  const card=document.getElementById('modalCard');
  card.style.setProperty('--m-bg',c.bg);
  card.style.setProperty('--m-ac',c.ac);
  card.style.animation='none';card.offsetHeight;
  card.style.animation='cardIn .35s cubic-bezier(.22,1,.36,1) both';
 
  document.getElementById('mNum').textContent=`Q ${String(idx+1).padStart(2,'0')}`;
  document.getElementById('mNum').style.color=c.ac;
  document.getElementById('mId').textContent=d.id;
  document.getElementById('mId').style.color=c.ac;
  document.getElementById('mName').textContent=d.name;
  document.getElementById('mQ').textContent=d.q;
 
  const ab=document.getElementById('answeredBtn');
  ab.classList.toggle('on',answered[idx]);
  ab.style.setProperty('--m-ac',c.ac);
  document.getElementById('modal').classList.add('open');
}
 
function closeModal(){document.getElementById('modal').classList.remove('open')}
function toggleAnswered(){
  answered[currentIdx]=!answered[currentIdx];
  document.getElementById('answeredBtn').classList.toggle('on',answered[currentIdx]);
  document.querySelectorAll('.note')[currentIdx].classList.toggle('answered',answered[currentIdx]);
}
 
document.getElementById('modal').addEventListener('click',e=>{
  if(e.target===document.getElementById('modal'))closeModal();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
 
// EDIT
function openEdit(){
  const tbody=document.getElementById('editBody');
  tbody.innerHTML='';
  data.forEach(d=>addEditRow(tbody,d.id,d.name,d.kw,d.q));
  document.getElementById('editOverlay').classList.add('open');
}
function addEditRow(tbody,id='',name='',kw='',q=''){
  const tr=document.createElement('tr');
  tr.innerHTML=`
    <td><input class="e-id" value="${id}" placeholder="학번"></td>
    <td><input class="e-name" value="${name}" placeholder="이름"></td>
    <td><input class="e-kw" value="${kw}" placeholder="키워드 (짧게)"></td>
    <td><input class="e-q" value="${q.replace(/"/g,'&quot;')}" placeholder="질문 전체 내용"></td>
    <td><button class="del-btn" onclick="this.closest('tr').remove()">✕</button></td>`;
  tbody.appendChild(tr);
}
function addRow(){addEditRow(document.getElementById('editBody'))}
function saveEdit(){
  const rows=document.querySelectorAll('#editBody tr');
  data=Array.from(rows).map(r=>({
    id:r.querySelector('.e-id').value.trim(),
    name:r.querySelector('.e-name').value.trim(),
    kw:r.querySelector('.e-kw').value.trim(),
    q:r.querySelector('.e-q').value.trim()
  })).filter(d=>d.name||d.q);
  answered=new Array(data.length).fill(false);
  closeEdit();render();
}
function closeEdit(){document.getElementById('editOverlay').classList.remove('open')}
document.getElementById('editOverlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('editOverlay'))closeEdit();
});
 
render();
</script>
</body>
</html>
